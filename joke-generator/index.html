<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-generator">
            <h1>😂 Random Joke Generator</h1>
            
            <div class="joke-display">
                <div class="joke-content" id="jokeContent">
                    <p class="placeholder">Click the button to get a random joke!</p>
                </div>
            </div>

            <div class="controls">
                <button id="getJokeBtn" class="btn btn-primary">Get Random Joke</button>
                <button id="copyBtn" class="btn btn-secondary" style="display: none;">Copy Joke</button>
            </div>

            <div class="joke-type-selector">
                <label for="jokeType">Joke Type:</label>
                <select id="jokeType">
                    <option value="any">Any</option>
                    <option value="general">General</option>
                    <option value="programming">Programming</option>
                    <option value="knock-knock">Knock-Knock</option>
                </select>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Getting a joke for you...</p>
            </div>

            <div class="error" id="error" style="display: none;"></div>

            <div class="joke-history">
                <h3>Recent Jokes</h3>
                <ul id="historyList"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
